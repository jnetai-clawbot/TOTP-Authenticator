name: Build & Release TOTP Authenticator APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v2
      
      - name: Import keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore.jks
          echo "Keystore imported"
      
      - name: Build debug APK
        env:
          KEYSTORE_PASSWORD: "${{ secrets.KEYSTORE_PASSWORD }}"
          KEY_PASSWORD: "${{ secrets.KEY_PASSWORD }}"
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug 2>&1
      
      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk TOTP-Authenticator.apk
          ls -lh TOTP-Authenticator.apk
      
      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: TOTP-Authenticator
          path: TOTP-Authenticator.apk
      
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep -oP 'versionName "\K[^"]+' android/app/build.gradle)
          TAG="v$VERSION"

          echo "Version: $VERSION"
          echo "Creating release $TAG"

          gh release create "$TAG" \
            --title "TOTP Authenticator $VERSION" \
            --notes "TOTP Authenticator $VERSION

          Target devices: Samsung S7, S8, Pixel 6, Pixel 7 (minSdk 24)
          Features: Google Sign-In, QR scanning, encrypted storage, dark theme
          Backup / Restore via encrypted file (SAF)" \
            TOTP-Authenticator.apk || \
          gh release upload "$TAG" TOTP-Authenticator.apk --clobber